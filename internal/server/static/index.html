<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVT - App Version Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%230066ff' fill-rule='evenodd' d='M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.5 2.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Outfit', system-ui, sans-serif; }
        .skeleton {
            background: linear-gradient(90deg, #f4f4f5 25%, #e4e4e7 50%, #f4f4f5 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #27272a 25%, #3f3f46 50%, #27272a 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .toast-enter { animation: toast-in 0.25s ease-out; }
        .toast-leave { animation: toast-out 0.25s ease-in forwards; }
        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-200">

    <!-- Toast Container -->
    <div class="fixed top-3 right-3 z-50 flex flex-col gap-1.5" x-cloak>
        <template x-for="toast in toasts" :key="toast.id">
            <div
                x-show="toast.visible"
                x-transition:enter="toast-enter"
                x-transition:leave="toast-leave"
                :class="{
                    'bg-zinc-800 dark:bg-zinc-700': toast.type === 'success',
                    'bg-red-600': toast.type === 'error',
                    'bg-zinc-700': toast.type === 'info'
                }"
                class="px-3 py-2 rounded-lg shadow-lg text-white text-sm flex items-center gap-2 min-w-[260px]"
            >
                <template x-if="toast.type === 'success'">
                    <svg class="w-4 h-4 flex-shrink-0 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </template>
                <template x-if="toast.type === 'error'">
                    <svg class="w-4 h-4 flex-shrink-0 text-red-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </template>
                <template x-if="toast.type === 'info'">
                    <svg class="w-4 h-4 flex-shrink-0 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </template>
                <span x-text="toast.message" class="flex-1"></span>
                <button @click="removeToast(toast.id)" class="hover:opacity-75 ml-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <div class="max-w-6xl mx-auto px-4 pt-4 pb-8">

        <!-- Header -->
        <header class="flex items-center justify-between mb-4 pb-3 border-b border-zinc-200 dark:border-zinc-800">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <span class="font-semibold text-sm tracking-tight">MAVT</span>
                <span class="text-zinc-400 dark:text-zinc-500 text-sm hidden sm:inline">· App Version Tracker</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-zinc-400 dark:text-zinc-500 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span x-text="lastSyncedText"></span>
                </span>

                <!-- Dropdown Menu -->
                <div class="relative" x-data="{ menuOpen: false }" @click.away="menuOpen = false">
                    <button
                        @click="menuOpen = !menuOpen"
                        class="w-7 h-7 rounded-lg flex items-center justify-center text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                        </svg>
                    </button>

                    <div
                        x-show="menuOpen"
                        x-transition:enter="transition ease-out duration-150"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-100"
                        x-transition:leave-start="opacity-100 scale-100"
                        x-transition:leave-end="opacity-0 scale-95"
                        class="absolute right-0 mt-1.5 w-48 bg-white dark:bg-zinc-900 rounded-lg shadow-lg border border-zinc-200 dark:border-zinc-700 py-1 z-50"
                        x-cloak
                    >
                        <button
                            @click="darkMode = !darkMode; localStorage.setItem('mavt-theme', darkMode ? 'dark' : 'light')"
                            class="w-full px-3 py-2 text-left text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 flex items-center gap-2.5 transition-colors"
                        >
                            <span x-show="!darkMode">🌙</span>
                            <span x-show="darkMode">☀️</span>
                            <span x-text="darkMode ? 'Light Mode' : 'Dark Mode'"></span>
                        </button>

                        <div class="border-t border-zinc-100 dark:border-zinc-800 my-1"></div>

                        <button
                            @click="exportBackup(); menuOpen = false"
                            :disabled="exportLoading"
                            class="w-full px-3 py-2 text-left text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2.5 transition-colors"
                        >
                            <svg class="w-4 h-4" :class="{ 'animate-spin': exportLoading }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span x-text="exportLoading ? 'Exporting...' : 'Export Backup'"></span>
                        </button>

                        <label class="w-full px-3 py-2 text-left text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 flex items-center gap-2.5 transition-colors cursor-pointer">
                            <input
                                type="file"
                                accept=".zip,application/zip,application/x-zip-compressed"
                                @change="importBackup($event); menuOpen = false"
                                class="hidden"
                            >
                            <svg class="w-4 h-4" :class="{ 'animate-spin': importLoading }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            <span x-text="importLoading ? 'Importing...' : 'Import Backup'"></span>
                        </label>

                        <div class="border-t border-zinc-100 dark:border-zinc-800 my-1"></div>

                        <a
                            href="https://github.com/hoiber/mavt"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="w-full px-3 py-2 text-left text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 flex items-center gap-2.5 transition-colors"
                        >
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                            </svg>
                            GitHub
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search -->
        <div class="mb-4">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input
                    type="text"
                    x-model="searchQuery"
                    @input.debounce.500ms="searchApps()"
                    placeholder="Search App Store to add apps..."
                    class="w-full pl-9 pr-4 py-2 text-sm rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-zinc-400 dark:placeholder-zinc-500"
                >
            </div>

            <!-- Search Results -->
            <div
                class="mt-1.5 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg overflow-hidden shadow-sm"
                x-show="searchResults.length > 0 || searchLoading"
            >
                <template x-if="searchLoading">
                    <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                        <template x-for="i in 3" :key="i">
                            <div class="flex items-center gap-3 px-3 py-2.5">
                                <div class="w-9 h-9 rounded-lg skeleton flex-shrink-0"></div>
                                <div class="flex-1">
                                    <div class="h-3.5 w-28 skeleton rounded mb-1.5"></div>
                                    <div class="h-3 w-40 skeleton rounded"></div>
                                </div>
                                <div class="w-14 h-7 skeleton rounded-lg"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!searchLoading">
                    <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                        <template x-for="app in searchResults" :key="app.bundle_id">
                            <div class="flex items-center gap-3 px-3 py-2.5 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors">
                                <img
                                    :src="app.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                                    :alt="app.track_name"
                                    class="w-9 h-9 rounded-lg object-cover flex-shrink-0"
                                >
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium truncate" x-text="app.track_name"></p>
                                    <p class="text-xs text-zinc-500 dark:text-zinc-400 truncate">
                                        <span x-text="app.artist_name"></span> · v<span x-text="app.version"></span> · <span class="font-mono" x-text="app.bundle_id"></span>
                                    </p>
                                </div>
                                <button
                                    x-show="!app.is_tracked"
                                    @click="trackApp(app.bundle_id)"
                                    :disabled="app.tracking"
                                    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 flex-shrink-0"
                                >
                                    <span x-show="app.tracking" class="animate-spin">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                    </span>
                                    <span x-text="app.tracking ? '' : 'Track'"></span>
                                </button>
                                <span x-show="app.is_tracked" class="px-3 py-1.5 bg-green-600 text-white rounded-lg text-xs font-medium flex items-center gap-1 flex-shrink-0">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                    Tracked
                                </span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <p x-show="searchQuery.length >= 2 && !searchLoading && searchResults.length === 0" class="mt-2 text-xs text-center text-zinc-400 py-2">
                No apps found for "<span x-text="searchQuery"></span>"
            </p>
        </div>

        <!-- Two Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

            <!-- Recent Updates -->
            <section class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden">
                <div class="px-4 py-2.5 border-b border-zinc-100 dark:border-zinc-800 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 flex-shrink-0"></span>
                    <h2 class="text-sm font-semibold">Recent Updates</h2>
                    <span class="text-zinc-400 dark:text-zinc-500 text-xs">· last 7 days</span>
                </div>

                <template x-if="updatesLoading">
                    <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                        <template x-for="i in 3" :key="i">
                            <div class="flex items-center gap-3 px-4 py-3">
                                <div class="w-9 h-9 rounded-lg skeleton flex-shrink-0"></div>
                                <div class="flex-1">
                                    <div class="h-3.5 w-32 skeleton rounded mb-1.5"></div>
                                    <div class="h-3 w-20 skeleton rounded"></div>
                                </div>
                                <div class="w-24 h-5 skeleton rounded-full"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!updatesLoading">
                    <div>
                        <template x-if="updates.length > 0">
                            <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                                <template x-for="update in updates" :key="update.bundle_id + update.updated_at">
                                    <div class="px-4 py-3 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors">
                                        <div class="flex items-center gap-3">
                                            <img
                                                :src="getAppIcon(update.bundle_id)"
                                                :alt="update.track_name"
                                                class="w-9 h-9 rounded-lg object-cover flex-shrink-0"
                                            >
                                            <div class="flex-1 min-w-0">
                                                <p class="text-sm font-medium truncate" x-text="update.track_name"></p>
                                                <p class="text-xs text-zinc-400 dark:text-zinc-500" x-text="formatDate(update.updated_at)"></p>
                                            </div>
                                            <span
                                                :class="isCritical(update.release_notes) ? 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 animate-pulse' : 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400'"
                                                class="text-xs font-medium font-mono px-2 py-0.5 rounded-full flex-shrink-0"
                                            >
                                                <span x-text="update.old_version"></span> → <span x-text="update.new_version"></span>
                                            </span>
                                        </div>
                                        <template x-if="update.release_notes && update.release_notes.trim()">
                                            <div class="mt-2 ml-12">
                                                <button
                                                    @click="update.showNotes = !update.showNotes"
                                                    class="text-xs text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1"
                                                >
                                                    <span x-text="update.showNotes ? 'Hide notes' : 'Release notes'"></span>
                                                    <svg class="w-3 h-3 transition-transform" :class="update.showNotes ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                    </svg>
                                                </button>
                                                <div
                                                    x-show="update.showNotes"
                                                    x-collapse
                                                    class="mt-1.5 p-2.5 bg-zinc-50 dark:bg-zinc-800 rounded-lg text-xs text-zinc-600 dark:text-zinc-300 whitespace-pre-wrap max-h-32 overflow-y-auto"
                                                    x-text="update.release_notes"
                                                ></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <p x-show="updates.length === 0" class="text-center text-xs text-zinc-400 dark:text-zinc-500 py-10">
                            No updates in the last 7 days
                        </p>
                    </div>
                </template>
            </section>

            <!-- Tracked Apps -->
            <section class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden">
                <div class="px-4 py-2.5 border-b border-zinc-100 dark:border-zinc-800 flex items-center gap-2">
                    <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    <h2 class="text-sm font-semibold">Tracked Apps</h2>
                    <span class="ml-auto bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 text-xs px-1.5 py-0.5 rounded-md font-mono" x-text="apps.length"></span>
                </div>

                <template x-if="appsLoading">
                    <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                        <template x-for="i in 4" :key="i">
                            <div class="flex items-center gap-3 px-4 py-3">
                                <div class="w-10 h-10 rounded-xl skeleton flex-shrink-0"></div>
                                <div class="flex-1">
                                    <div class="h-3.5 w-36 skeleton rounded mb-1.5"></div>
                                    <div class="h-3 w-24 skeleton rounded"></div>
                                </div>
                                <div class="w-12 h-5 skeleton rounded-full"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!appsLoading">
                    <div>
                        <template x-if="apps.length > 0">
                            <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                                <template x-for="app in apps" :key="app.bundle_id">
                                    <div
                                        @click="showHistory(app)"
                                        class="px-4 py-3 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors cursor-pointer"
                                    >
                                        <div class="flex items-center gap-3">
                                            <img
                                                :src="app.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                                                :alt="app.track_name"
                                                class="w-10 h-10 rounded-xl object-cover flex-shrink-0"
                                            >
                                            <div class="flex-1 min-w-0">
                                                <p class="text-sm font-medium truncate" x-text="app.track_name"></p>
                                                <p class="text-xs text-zinc-400 dark:text-zinc-500 truncate" x-text="app.artist_name"></p>
                                            </div>
                                            <div class="flex flex-col items-end gap-1 flex-shrink-0">
                                                <span
                                                    :class="isCritical(app.release_notes) ? 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 animate-pulse' : 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400'"
                                                    class="text-xs font-medium font-mono px-1.5 py-0.5 rounded"
                                                    x-text="'v' + app.version"
                                                ></span>
                                                <span class="text-xs text-zinc-400 dark:text-zinc-500" x-text="formatRelativeTime(app.last_checked)"></span>
                                            </div>
                                        </div>
                                        <template x-if="app.release_notes && app.release_notes.trim()">
                                            <div class="mt-2 ml-[52px]">
                                                <button
                                                    @click.stop="app.showNotes = !app.showNotes"
                                                    class="text-xs text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1"
                                                >
                                                    <span x-text="'v' + app.version + ' notes'"></span>
                                                    <svg class="w-3 h-3 transition-transform" :class="app.showNotes ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                    </svg>
                                                </button>
                                                <div
                                                    x-show="app.showNotes"
                                                    x-collapse
                                                    @click.stop
                                                    class="mt-1.5 p-2.5 bg-zinc-50 dark:bg-zinc-800 rounded-lg text-xs text-zinc-600 dark:text-zinc-300 whitespace-pre-wrap max-h-32 overflow-y-auto border border-zinc-100 dark:border-zinc-700"
                                                    x-text="app.release_notes"
                                                ></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <p x-show="apps.length === 0" class="text-center text-xs text-zinc-400 dark:text-zinc-500 py-10">
                            No apps tracked. Search above to add apps.
                        </p>
                    </div>
                </template>
            </section>
        </div>

        <!-- Footer -->
        <footer class="mt-4 text-center text-zinc-400 dark:text-zinc-500 text-xs py-3">
            MAVT v{{VERSION}}{{COMMIT_BADGE}} · <a href="https://github.com/hoiber/mavt" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors">GitHub</a>
        </footer>
    </div>

    <!-- Version History Modal -->
    <div
        x-show="historyModal.open"
        x-cloak
        class="fixed inset-0 z-50 flex items-center justify-center p-4"
        @keydown.escape.window="historyModal.open = false"
    >
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="historyModal.open = false"></div>
        <div
            class="relative bg-white dark:bg-zinc-900 rounded-xl shadow-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden border border-zinc-200 dark:border-zinc-700"
            x-show="historyModal.open"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
        >
            <!-- Modal Header -->
            <div class="px-5 py-4 border-b border-zinc-100 dark:border-zinc-800 flex items-center gap-3">
                <img
                    :src="historyModal.app?.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                    class="w-10 h-10 rounded-xl object-cover flex-shrink-0"
                >
                <div class="flex-1 min-w-0">
                    <h2 class="font-semibold text-sm truncate" x-text="historyModal.app?.track_name"></h2>
                    <p class="text-xs text-zinc-400 dark:text-zinc-500 truncate">
                        <span x-text="historyModal.app?.artist_name"></span>
                        <span class="font-mono ml-1.5 text-zinc-300 dark:text-zinc-600" x-text="historyModal.app?.bundle_id"></span>
                    </p>
                </div>
                <button
                    @click="historyModal.open = false"
                    class="w-7 h-7 flex items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors flex-shrink-0"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="overflow-y-auto max-h-[55vh]">
                <div x-show="historyModal.loading" class="flex items-center justify-center py-12 text-zinc-400 text-sm gap-2">
                    <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Loading...
                </div>

                <template x-if="!historyModal.loading && historyModal.history.length > 0">
                    <table class="w-full text-sm">
                        <thead class="bg-zinc-50 dark:bg-zinc-800/50 sticky top-0">
                            <tr>
                                <th class="text-left px-5 py-2.5 text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wide whitespace-nowrap">Date</th>
                                <th class="text-left px-4 py-2.5 text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wide whitespace-nowrap">Version</th>
                                <th class="text-left px-4 py-2.5 text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wide">Release Notes</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-zinc-100 dark:divide-zinc-800">
                            <template x-for="entry in historyModal.history" :key="entry.updated_at">
                                <tr class="hover:bg-zinc-50 dark:hover:bg-zinc-800/30 transition-colors">
                                    <td class="px-5 py-3 text-xs text-zinc-500 whitespace-nowrap" x-text="formatDate(entry.updated_at)"></td>
                                    <td class="px-4 py-3 whitespace-nowrap">
                                        <span class="font-mono text-xs text-zinc-400 dark:text-zinc-500" x-text="entry.old_version"></span>
                                        <span class="mx-1.5 text-zinc-300 dark:text-zinc-600 text-xs">→</span>
                                        <span class="font-mono text-xs font-medium bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-1.5 py-0.5 rounded" x-text="entry.new_version"></span>
                                    </td>
                                    <td class="px-4 py-3 text-xs text-zinc-500 dark:text-zinc-400 max-w-xs">
                                        <div class="line-clamp-2 whitespace-pre-wrap" x-text="entry.release_notes || '—'"></div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <p x-show="!historyModal.loading && historyModal.history.length === 0" class="text-center text-xs text-zinc-400 dark:text-zinc-500 py-10">
                    No version history yet. Changes will appear here when the app updates.
                </p>
            </div>

            <!-- Modal Footer -->
            <div class="border-t border-zinc-100 dark:border-zinc-800 px-5 py-3 flex justify-end">
                <button
                    @click="removeApp(historyModal.app?.bundle_id)"
                    :disabled="historyModal.removing"
                    class="px-3 py-1.5 bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5"
                >
                    <svg x-show="!historyModal.removing" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    <svg x-show="historyModal.removing" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="historyModal.removing ? 'Removing...' : 'Remove App'"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                darkMode: localStorage.getItem('mavt-theme') === 'dark',
                apps: [],
                updates: [],
                searchQuery: '',
                searchResults: [],
                searchLoading: false,
                appsLoading: true,
                updatesLoading: true,
                exportLoading: false,
                importLoading: false,
                lastSyncTime: null,
                lastSyncedText: 'Loading...',
                lastKnownUpdate: null,
                toasts: [],
                toastId: 0,
                historyModal: {
                    open: false,
                    app: null,
                    history: [],
                    loading: false,
                    removing: false
                },

                async init() {
                    await this.refreshData();
                    await this.initializeUpdateTracking();

                    // Poll for new updates every 30 seconds
                    setInterval(() => this.checkForNewUpdates(), 30000);

                    // Refresh at configured interval
                    setInterval(() => this.refreshData(), {{CHECK_INTERVAL_MS}});

                    // Update relative time every second
                    setInterval(() => this.updateLastSyncedDisplay(), 1000);
                },

                async refreshData() {
                    await Promise.all([this.loadApps(), this.loadUpdates()]);
                    this.lastSyncTime = Date.now();
                    this.updateLastSyncedDisplay();
                },

                async loadApps() {
                    try {
                        const response = await fetch('/api/apps');
                        const apps = await response.json();
                        this.apps = (apps || []).map(app => ({ ...app, showNotes: false }));
                    } catch (error) {
                        this.showToast('Failed to load apps: ' + error.message, 'error');
                    } finally {
                        this.appsLoading = false;
                    }
                },

                async loadUpdates() {
                    try {
                        const response = await fetch('/api/updates?since=168h');
                        const updates = await response.json();
                        this.updates = (updates || []).map(update => ({ ...update, showNotes: false }));
                    } catch (error) {
                        this.showToast('Failed to load updates: ' + error.message, 'error');
                    } finally {
                        this.updatesLoading = false;
                    }
                },

                async searchApps() {
                    if (this.searchQuery.length < 2) {
                        this.searchResults = [];
                        return;
                    }

                    this.searchLoading = true;
                    try {
                        const response = await fetch(`/api/search?q=${encodeURIComponent(this.searchQuery)}&limit=10`);
                        const apps = await response.json();
                        this.searchResults = (apps || []).map(app => ({ ...app, tracking: false }));
                    } catch (error) {
                        this.showToast('Search failed: ' + error.message, 'error');
                    } finally {
                        this.searchLoading = false;
                    }
                },

                async trackApp(bundleId) {
                    const app = this.searchResults.find(a => a.bundle_id === bundleId);
                    if (app) app.tracking = true;

                    try {
                        const response = await fetch('/api/track', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bundle_id: bundleId })
                        });

                        if (!response.ok) throw new Error(await response.text());

                        if (app) app.is_tracked = true;
                        this.showToast('App added to tracking', 'success');
                        await this.loadApps();
                    } catch (error) {
                        this.showToast('Failed to add app: ' + error.message, 'error');
                    } finally {
                        if (app) app.tracking = false;
                    }
                },

                async showHistory(app) {
                    this.historyModal.open = true;
                    this.historyModal.app = app;
                    this.historyModal.loading = true;
                    this.historyModal.history = [];

                    try {
                        const response = await fetch(`/api/history?bundle_id=${encodeURIComponent(app.bundle_id)}`);
                        if (!response.ok) throw new Error('Failed to load history');
                        const history = await response.json() || [];
                        // Reverse to show most recent updates first
                        this.historyModal.history = history.reverse();
                    } catch (error) {
                        this.showToast('Failed to load version history: ' + error.message, 'error');
                    } finally {
                        this.historyModal.loading = false;
                    }
                },

                async removeApp(bundleId) {
                    if (!bundleId) return;
                    if (!confirm('Are you sure you want to remove this app from tracking? This will delete all version history.')) return;

                    this.historyModal.removing = true;
                    try {
                        const response = await fetch('/api/track', {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bundle_id: bundleId })
                        });

                        if (!response.ok) throw new Error(await response.text());

                        this.historyModal.open = false;
                        this.showToast('App removed from tracking', 'success');
                        await this.loadApps();
                    } catch (error) {
                        this.showToast('Failed to remove app: ' + error.message, 'error');
                    } finally {
                        this.historyModal.removing = false;
                    }
                },

                async initializeUpdateTracking() {
                    try {
                        const response = await fetch('/api/last-update');
                        const data = await response.json();
                        if (data.has_updates) {
                            this.lastKnownUpdate = new Date(data.last_update).getTime();
                        }
                    } catch (error) {
                        console.error('Failed to initialize update tracking:', error);
                    }
                },

                async checkForNewUpdates() {
                    try {
                        const response = await fetch('/api/last-update');
                        const data = await response.json();

                        if (data.has_updates) {
                            const currentUpdate = new Date(data.last_update).getTime();
                            if (this.lastKnownUpdate !== null && currentUpdate > this.lastKnownUpdate) {
                                console.log('New update detected, refreshing data...');
                                await this.refreshData();
                            }
                            this.lastKnownUpdate = currentUpdate;
                        }
                    } catch (error) {
                        console.error('Failed to check for updates:', error);
                    }
                },

                updateLastSyncedDisplay() {
                    if (!this.lastSyncTime) {
                        this.lastSyncedText = 'Loading...';
                        return;
                    }

                    const diffMs = Date.now() - this.lastSyncTime;
                    const diffSecs = Math.floor(diffMs / 1000);
                    const diffMins = Math.floor(diffSecs / 60);

                    if (diffSecs < 10) {
                        this.lastSyncedText = 'Just now';
                    } else if (diffSecs < 60) {
                        this.lastSyncedText = diffSecs + 's ago';
                    } else if (diffMins < 60) {
                        this.lastSyncedText = diffMins + (diffMins === 1 ? ' min ago' : ' mins ago');
                    } else {
                        const diffHours = Math.floor(diffMins / 60);
                        this.lastSyncedText = diffHours + (diffHours === 1 ? ' hour ago' : ' hours ago');
                    }
                },

                formatDate(dateStr) {
                    return new Date(dateStr).toLocaleString();
                },

                formatRelativeTime(dateStr) {
                    const date = new Date(dateStr);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const diffDays = Math.floor(diffHours / 24);

                    if (diffMins < 1) return 'just now';
                    if (diffMins < 60) return diffMins + 'm ago';
                    if (diffHours < 24) return diffHours + 'h ago';
                    return diffDays + 'd ago';
                },

                isCritical(releaseNotes) {
                    return releaseNotes && releaseNotes.toUpperCase().includes('CVE');
                },

                getAppIcon(bundleId) {
                    const app = this.apps.find(a => a.bundle_id === bundleId);
                    return app?.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E';
                },

                async exportBackup() {
                    this.exportLoading = true;
                    try {
                        const response = await fetch('/api/export');
                        if (!response.ok) {
                            throw new Error('Export failed');
                        }

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = response.headers.get('Content-Disposition')?.split('filename=')[1] || 'mavt-backup.zip';
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);

                        this.showToast('Backup exported successfully', 'success');
                    } catch (error) {
                        this.showToast('Failed to export backup: ' + error.message, 'error');
                    } finally {
                        this.exportLoading = false;
                    }
                },

                async importBackup(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.importLoading = true;
                    try {
                        const formData = new FormData();
                        formData.append('backup', file);

                        const response = await fetch('/api/import', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            const error = await response.text();
                            throw new Error(error || 'Import failed');
                        }

                        const result = await response.json();
                        this.showToast(`Backup imported successfully (${result.app_count} apps)`, 'success');

                        // Refresh data after import
                        await this.refreshData();
                    } catch (error) {
                        this.showToast('Failed to import backup: ' + error.message, 'error');
                    } finally {
                        this.importLoading = false;
                        // Reset file input
                        event.target.value = '';
                    }
                },

                showToast(message, type = 'info') {
                    const id = ++this.toastId;
                    const toast = { id, message, type, visible: true };
                    this.toasts.push(toast);

                    setTimeout(() => {
                        toast.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }, 4000);
                },

                removeToast(id) {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }
            }
        }
    </script>
</body>
</html>
