<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVT - App Version Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%230066ff' fill-rule='evenodd' d='M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.5 2.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .toast-enter {
            animation: toast-in 0.3s ease-out;
        }
        .toast-leave {
            animation: toast-out 0.3s ease-in forwards;
        }
        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <!-- Toast Container -->
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2" x-cloak>
        <template x-for="toast in toasts" :key="toast.id">
            <div
                x-show="toast.visible"
                x-transition:enter="toast-enter"
                x-transition:leave="toast-leave"
                :class="{
                    'bg-green-500': toast.type === 'success',
                    'bg-red-500': toast.type === 'error',
                    'bg-blue-500': toast.type === 'info'
                }"
                class="px-4 py-3 rounded-lg shadow-lg text-white flex items-center gap-3 min-w-[300px]"
            >
                <template x-if="toast.type === 'success'">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </template>
                <template x-if="toast.type === 'error'">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </template>
                <template x-if="toast.type === 'info'">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </template>
                <span x-text="toast.message" class="flex-1"></span>
                <button @click="removeToast(toast.id)" class="hover:opacity-75">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="bg-gradient-to-r from-primary-600 to-primary-700 rounded-xl shadow-lg mb-6 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">MAVT</h1>
                        <p class="text-white/80 text-sm">App Version Tracker</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="bg-white/15 border border-white/30 rounded-lg px-3 py-1.5 text-white text-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span x-text="lastSyncedText"></span>
                    </div>
                    <button
                        @click="darkMode = !darkMode; localStorage.setItem('mavt-theme', darkMode ? 'dark' : 'light')"
                        class="bg-white/15 border border-white/30 rounded-full w-9 h-9 flex items-center justify-center text-white hover:bg-white/25 transition-all"
                    >
                        <span x-show="!darkMode">&#127769;</span>
                        <span x-show="darkMode">&#9728;&#65039;</span>
                    </button>
                    <a
                        href="https://github.com/hoiber/mavt"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="bg-white/15 border border-white/30 rounded-full w-9 h-9 flex items-center justify-center text-white hover:bg-white/25 transition-all"
                    >
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <!-- Search Section -->
        <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 mb-6">
            <h2 class="text-lg font-semibold text-primary-600 dark:text-primary-400 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Search & Add Apps
            </h2>
            <div class="relative">
                <input
                    type="text"
                    x-model="searchQuery"
                    @input.debounce.500ms="searchApps()"
                    placeholder="Search App Store (e.g., 'Instagram', 'WhatsApp')..."
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all"
                >
                <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <!-- Search Results -->
            <div class="mt-4 space-y-2" x-show="searchResults.length > 0 || searchLoading">
                <!-- Search Loading Skeleton -->
                <template x-if="searchLoading">
                    <div class="space-y-2">
                        <template x-for="i in 3" :key="i">
                            <div class="flex items-center gap-4 p-3 rounded-lg bg-gray-50 dark:bg-gray-700/50">
                                <div class="w-12 h-12 rounded-xl skeleton"></div>
                                <div class="flex-1">
                                    <div class="h-4 w-32 skeleton rounded mb-2"></div>
                                    <div class="h-3 w-48 skeleton rounded"></div>
                                </div>
                                <div class="w-20 h-8 skeleton rounded"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Search Results -->
                <template x-if="!searchLoading">
                    <template x-for="app in searchResults" :key="app.bundle_id">
                        <div class="flex items-center gap-4 p-3 rounded-lg bg-gray-50 dark:bg-gray-700/50 border-l-4 border-primary-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <img
                                :src="app.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                                :alt="app.track_name"
                                class="w-12 h-12 rounded-xl shadow-sm object-cover"
                            >
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold truncate" x-text="app.track_name"></h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 truncate">
                                    <span x-text="app.artist_name"></span> &bull; v<span x-text="app.version"></span> &bull; <span x-text="app.bundle_id" class="font-mono text-xs"></span>
                                </p>
                            </div>
                            <button
                                x-show="!app.is_tracked"
                                @click="trackApp(app.bundle_id)"
                                :disabled="app.tracking"
                                class="px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-400 text-white rounded-lg font-medium text-sm transition-colors flex items-center gap-2"
                            >
                                <span x-show="app.tracking" class="animate-spin">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </span>
                                <span x-text="app.tracking ? 'Adding...' : 'Track'"></span>
                            </button>
                            <span x-show="app.is_tracked" class="px-4 py-2 bg-green-600 text-white rounded-lg font-medium text-sm flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                Tracked
                            </span>
                        </div>
                    </template>
                </template>
            </div>

            <p x-show="searchQuery.length >= 2 && !searchLoading && searchResults.length === 0" class="text-center text-gray-500 dark:text-gray-400 py-4">
                No apps found for "<span x-text="searchQuery"></span>"
            </p>
        </section>

        <!-- Recent Updates Section -->
        <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 mb-6">
            <h2 class="text-lg font-semibold text-primary-600 dark:text-primary-400 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                Recent Updates (Last 7 Days)
            </h2>

            <!-- Updates Loading Skeleton -->
            <template x-if="updatesLoading">
                <div class="space-y-3">
                    <template x-for="i in 3" :key="i">
                        <div class="p-4 rounded-lg bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl skeleton"></div>
                                <div class="flex-1">
                                    <div class="h-4 w-40 skeleton rounded mb-2"></div>
                                    <div class="h-3 w-24 skeleton rounded"></div>
                                </div>
                                <div class="w-32 h-6 skeleton rounded-full"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Updates List -->
            <template x-if="!updatesLoading">
                <div class="space-y-3">
                    <template x-for="(update, index) in updates" :key="update.bundle_id + update.updated_at">
                        <div
                            :class="isCritical(update.release_notes) ? 'bg-red-50 dark:bg-red-900/20 border-red-500' : 'bg-green-50 dark:bg-green-900/20 border-green-500'"
                            class="p-4 rounded-lg border-l-4"
                        >
                            <div class="flex items-start gap-4">
                                <img
                                    :src="getAppIcon(update.bundle_id)"
                                    :alt="update.track_name"
                                    class="w-12 h-12 rounded-xl shadow-sm object-cover flex-shrink-0"
                                >
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-3 flex-wrap">
                                        <h3 class="font-semibold" x-text="update.track_name"></h3>
                                        <span
                                            :class="isCritical(update.release_notes) ? 'bg-red-500 animate-pulse' : 'bg-green-500'"
                                            class="px-3 py-1 text-white rounded-full text-sm font-medium"
                                        >
                                            <span x-text="update.old_version"></span> &rarr; <span x-text="update.new_version"></span>
                                        </span>
                                    </div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" x-text="formatDate(update.updated_at)"></p>

                                    <!-- Release Notes Toggle -->
                                    <template x-if="update.release_notes && update.release_notes.trim()">
                                        <div class="mt-3">
                                            <button
                                                @click="update.showNotes = !update.showNotes"
                                                class="text-sm text-primary-600 dark:text-primary-400 hover:underline flex items-center gap-1"
                                            >
                                                <span x-text="update.showNotes ? 'Hide' : 'Show'"></span> release notes
                                                <svg class="w-4 h-4 transition-transform" :class="update.showNotes ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                            </button>
                                            <div
                                                x-show="update.showNotes"
                                                x-collapse
                                                class="mt-2 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm text-gray-600 dark:text-gray-300 whitespace-pre-wrap max-h-40 overflow-y-auto"
                                                x-text="update.release_notes"
                                            ></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <p x-show="updates.length === 0" class="text-center text-gray-500 dark:text-gray-400 py-8">
                        No updates in the last 7 days
                    </p>
                </div>
            </template>
        </section>

        <!-- Tracked Apps Section -->
        <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 mb-6">
            <h2 class="text-lg font-semibold text-primary-600 dark:text-primary-400 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
                Tracked Apps
                <span class="bg-primary-100 dark:bg-primary-900 text-primary-600 dark:text-primary-400 px-2 py-0.5 rounded-full text-sm" x-text="apps.length"></span>
            </h2>

            <!-- Apps Loading Skeleton -->
            <template x-if="appsLoading">
                <div class="space-y-3">
                    <template x-for="i in 4" :key="i">
                        <div class="p-4 rounded-lg bg-gray-50 dark:bg-gray-700/50 border-l-4 border-primary-500">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-xl skeleton"></div>
                                <div class="flex-1">
                                    <div class="h-5 w-40 skeleton rounded mb-2"></div>
                                    <div class="h-3 w-64 skeleton rounded"></div>
                                </div>
                                <div class="w-16 h-7 skeleton rounded-full"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Apps List -->
            <template x-if="!appsLoading">
                <div class="space-y-3">
                    <template x-for="app in apps" :key="app.bundle_id">
                        <div
                            @click="showHistory(app)"
                            class="p-4 rounded-lg bg-gray-50 dark:bg-gray-700/50 border-l-4 border-primary-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all cursor-pointer hover:shadow-md hover:-translate-y-0.5"
                        >
                            <div class="flex items-center gap-4">
                                <img
                                    :src="app.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                                    :alt="app.track_name"
                                    class="w-14 h-14 rounded-xl shadow-sm object-cover flex-shrink-0"
                                >
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-semibold text-lg" x-text="app.track_name"></h3>
                                    <div class="flex items-center gap-4 text-sm text-gray-500 dark:text-gray-400 flex-wrap mt-1">
                                        <span class="flex items-center gap-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                            </svg>
                                            <span x-text="app.artist_name"></span>
                                        </span>
                                        <span class="font-mono text-xs bg-gray-200 dark:bg-gray-600 px-2 py-0.5 rounded" x-text="app.bundle_id"></span>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-2">
                                    <span
                                        :class="isCritical(app.release_notes) ? 'bg-orange-500 animate-pulse' : 'bg-primary-600'"
                                        class="px-3 py-1 text-white rounded-full text-sm font-bold"
                                        x-text="'v' + app.version"
                                    ></span>
                                    <span class="text-xs text-gray-400" x-text="'Checked ' + formatRelativeTime(app.last_checked)"></span>
                                </div>
                            </div>

                            <!-- Release Notes Preview -->
                            <template x-if="app.release_notes && app.release_notes.trim()">
                                <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-600">
                                    <button
                                        @click.stop="app.showNotes = !app.showNotes"
                                        class="text-sm text-primary-600 dark:text-primary-400 hover:underline flex items-center gap-1"
                                    >
                                        Latest release notes (v<span x-text="app.version"></span>)
                                        <svg class="w-4 h-4 transition-transform" :class="app.showNotes ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                        </svg>
                                    </button>
                                    <div
                                        x-show="app.showNotes"
                                        x-collapse
                                        @click.stop
                                        class="mt-2 p-3 bg-white dark:bg-gray-800 rounded-lg text-sm text-gray-600 dark:text-gray-300 whitespace-pre-wrap max-h-40 overflow-y-auto border border-gray-200 dark:border-gray-600"
                                        x-text="app.release_notes"
                                    ></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <p x-show="apps.length === 0" class="text-center text-gray-500 dark:text-gray-400 py-8">
                        No apps are currently being tracked. Use the search above to add apps.
                    </p>
                </div>
            </template>
        </section>

        <!-- Footer -->
        <footer class="text-center text-gray-400 dark:text-gray-500 text-sm py-4">
            MAVT v{{VERSION}} &bull; <a href="https://github.com/hoiber/mavt" class="text-primary-600 dark:text-primary-400 hover:underline">GitHub</a>
        </footer>
    </div>

    <!-- Version History Modal -->
    <div
        x-show="historyModal.open"
        x-cloak
        class="fixed inset-0 z-50 flex items-center justify-center p-4"
        @keydown.escape.window="historyModal.open = false"
    >
        <div class="absolute inset-0 bg-black/50" @click="historyModal.open = false"></div>
        <div
            class="relative bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-3xl w-full max-h-[85vh] overflow-hidden"
            x-show="historyModal.open"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
        >
            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-primary-600 to-primary-700 p-5 text-white">
                <button
                    @click="historyModal.open = false"
                    class="absolute top-4 right-4 bg-white/15 border border-white/30 rounded-full w-9 h-9 flex items-center justify-center hover:bg-white/25 transition-all"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
                <div class="flex items-center gap-4">
                    <img
                        :src="historyModal.app?.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23ffffff%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E'"
                        class="w-14 h-14 rounded-xl shadow-lg object-cover"
                    >
                    <div>
                        <h2 class="text-xl font-bold" x-text="historyModal.app?.track_name"></h2>
                        <p class="text-white/80 text-sm" x-text="historyModal.app?.artist_name"></p>
                        <p class="text-white/60 text-xs font-mono mt-1" x-text="historyModal.app?.bundle_id"></p>
                    </div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="p-5 max-h-[50vh] overflow-y-auto">
                <!-- Loading -->
                <div x-show="historyModal.loading" class="text-center py-8 text-gray-500">
                    <svg class="animate-spin w-8 h-8 mx-auto mb-2" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Loading version history...
                </div>

                <!-- History Table -->
                <template x-if="!historyModal.loading && historyModal.history.length > 0">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200 dark:border-gray-700">
                                <th class="text-left py-3 px-2 text-sm font-semibold text-gray-600 dark:text-gray-300">Date</th>
                                <th class="text-left py-3 px-2 text-sm font-semibold text-gray-600 dark:text-gray-300">Version Change</th>
                                <th class="text-left py-3 px-2 text-sm font-semibold text-gray-600 dark:text-gray-300">Release Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="entry in historyModal.history" :key="entry.updated_at">
                                <tr class="border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30">
                                    <td class="py-3 px-2 text-sm" x-text="formatDate(entry.updated_at)"></td>
                                    <td class="py-3 px-2">
                                        <span class="bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300 px-2 py-0.5 rounded text-sm" x-text="entry.old_version"></span>
                                        <span class="mx-2 text-gray-400">&rarr;</span>
                                        <span class="bg-primary-600 text-white px-2 py-0.5 rounded text-sm" x-text="entry.new_version"></span>
                                    </td>
                                    <td class="py-3 px-2 text-sm text-gray-600 dark:text-gray-400 max-w-xs">
                                        <div class="whitespace-pre-wrap line-clamp-3" x-text="entry.release_notes || 'No release notes'"></div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <!-- Empty State -->
                <p x-show="!historyModal.loading && historyModal.history.length === 0" class="text-center text-gray-500 dark:text-gray-400 py-8">
                    No version history available yet. Updates will appear here when the app version changes.
                </p>
            </div>

            <!-- Modal Footer -->
            <div class="border-t border-gray-200 dark:border-gray-700 p-4 bg-gray-50 dark:bg-gray-900/50 flex justify-end">
                <button
                    @click="removeApp(historyModal.app?.bundle_id)"
                    :disabled="historyModal.removing"
                    class="px-4 py-2 bg-red-600 hover:bg-red-700 disabled:bg-red-400 text-white rounded-lg font-medium text-sm transition-colors flex items-center gap-2"
                >
                    <svg x-show="!historyModal.removing" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    <svg x-show="historyModal.removing" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="historyModal.removing ? 'Removing...' : 'Remove App'"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                darkMode: localStorage.getItem('mavt-theme') === 'dark',
                apps: [],
                updates: [],
                searchQuery: '',
                searchResults: [],
                searchLoading: false,
                appsLoading: true,
                updatesLoading: true,
                lastSyncTime: null,
                lastSyncedText: 'Loading...',
                lastKnownUpdate: null,
                toasts: [],
                toastId: 0,
                historyModal: {
                    open: false,
                    app: null,
                    history: [],
                    loading: false,
                    removing: false
                },

                async init() {
                    await this.refreshData();
                    await this.initializeUpdateTracking();

                    // Poll for new updates every 30 seconds
                    setInterval(() => this.checkForNewUpdates(), 30000);

                    // Refresh at configured interval
                    setInterval(() => this.refreshData(), {{CHECK_INTERVAL_MS}});

                    // Update relative time every second
                    setInterval(() => this.updateLastSyncedDisplay(), 1000);
                },

                async refreshData() {
                    await Promise.all([this.loadApps(), this.loadUpdates()]);
                    this.lastSyncTime = Date.now();
                    this.updateLastSyncedDisplay();
                },

                async loadApps() {
                    try {
                        const response = await fetch('/api/apps');
                        const apps = await response.json();
                        this.apps = (apps || []).map(app => ({ ...app, showNotes: false }));
                    } catch (error) {
                        this.showToast('Failed to load apps: ' + error.message, 'error');
                    } finally {
                        this.appsLoading = false;
                    }
                },

                async loadUpdates() {
                    try {
                        const response = await fetch('/api/updates?since=168h');
                        const updates = await response.json();
                        this.updates = (updates || []).map(update => ({ ...update, showNotes: false }));
                    } catch (error) {
                        this.showToast('Failed to load updates: ' + error.message, 'error');
                    } finally {
                        this.updatesLoading = false;
                    }
                },

                async searchApps() {
                    if (this.searchQuery.length < 2) {
                        this.searchResults = [];
                        return;
                    }

                    this.searchLoading = true;
                    try {
                        const response = await fetch(`/api/search?q=${encodeURIComponent(this.searchQuery)}&limit=10`);
                        const apps = await response.json();
                        this.searchResults = (apps || []).map(app => ({ ...app, tracking: false }));
                    } catch (error) {
                        this.showToast('Search failed: ' + error.message, 'error');
                    } finally {
                        this.searchLoading = false;
                    }
                },

                async trackApp(bundleId) {
                    const app = this.searchResults.find(a => a.bundle_id === bundleId);
                    if (app) app.tracking = true;

                    try {
                        const response = await fetch('/api/track', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bundle_id: bundleId })
                        });

                        if (!response.ok) throw new Error(await response.text());

                        if (app) app.is_tracked = true;
                        this.showToast('App added to tracking', 'success');
                        await this.loadApps();
                    } catch (error) {
                        this.showToast('Failed to add app: ' + error.message, 'error');
                    } finally {
                        if (app) app.tracking = false;
                    }
                },

                async showHistory(app) {
                    this.historyModal.open = true;
                    this.historyModal.app = app;
                    this.historyModal.loading = true;
                    this.historyModal.history = [];

                    try {
                        const response = await fetch(`/api/history?bundle_id=${encodeURIComponent(app.bundle_id)}`);
                        if (!response.ok) throw new Error('Failed to load history');
                        this.historyModal.history = await response.json() || [];
                    } catch (error) {
                        this.showToast('Failed to load version history: ' + error.message, 'error');
                    } finally {
                        this.historyModal.loading = false;
                    }
                },

                async removeApp(bundleId) {
                    if (!bundleId) return;
                    if (!confirm('Are you sure you want to remove this app from tracking? This will delete all version history.')) return;

                    this.historyModal.removing = true;
                    try {
                        const response = await fetch('/api/track', {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bundle_id: bundleId })
                        });

                        if (!response.ok) throw new Error(await response.text());

                        this.historyModal.open = false;
                        this.showToast('App removed from tracking', 'success');
                        await this.loadApps();
                    } catch (error) {
                        this.showToast('Failed to remove app: ' + error.message, 'error');
                    } finally {
                        this.historyModal.removing = false;
                    }
                },

                async initializeUpdateTracking() {
                    try {
                        const response = await fetch('/api/last-update');
                        const data = await response.json();
                        if (data.has_updates) {
                            this.lastKnownUpdate = new Date(data.last_update).getTime();
                        }
                    } catch (error) {
                        console.error('Failed to initialize update tracking:', error);
                    }
                },

                async checkForNewUpdates() {
                    try {
                        const response = await fetch('/api/last-update');
                        const data = await response.json();

                        if (data.has_updates) {
                            const currentUpdate = new Date(data.last_update).getTime();
                            if (this.lastKnownUpdate !== null && currentUpdate > this.lastKnownUpdate) {
                                console.log('New update detected, refreshing data...');
                                await this.refreshData();
                            }
                            this.lastKnownUpdate = currentUpdate;
                        }
                    } catch (error) {
                        console.error('Failed to check for updates:', error);
                    }
                },

                updateLastSyncedDisplay() {
                    if (!this.lastSyncTime) {
                        this.lastSyncedText = 'Loading...';
                        return;
                    }

                    const diffMs = Date.now() - this.lastSyncTime;
                    const diffSecs = Math.floor(diffMs / 1000);
                    const diffMins = Math.floor(diffSecs / 60);

                    if (diffSecs < 10) {
                        this.lastSyncedText = 'Just now';
                    } else if (diffSecs < 60) {
                        this.lastSyncedText = diffSecs + 's ago';
                    } else if (diffMins < 60) {
                        this.lastSyncedText = diffMins + (diffMins === 1 ? ' min ago' : ' mins ago');
                    } else {
                        const diffHours = Math.floor(diffMins / 60);
                        this.lastSyncedText = diffHours + (diffHours === 1 ? ' hour ago' : ' hours ago');
                    }
                },

                formatDate(dateStr) {
                    return new Date(dateStr).toLocaleString();
                },

                formatRelativeTime(dateStr) {
                    const date = new Date(dateStr);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const diffDays = Math.floor(diffHours / 24);

                    if (diffMins < 1) return 'just now';
                    if (diffMins < 60) return diffMins + 'm ago';
                    if (diffHours < 24) return diffHours + 'h ago';
                    return diffDays + 'd ago';
                },

                isCritical(releaseNotes) {
                    return releaseNotes && releaseNotes.toUpperCase().includes('CVE');
                },

                getAppIcon(bundleId) {
                    const app = this.apps.find(a => a.bundle_id === bundleId);
                    return app?.artwork_url || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27%23cbd5e1%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z%27/%3E%3C/svg%3E';
                },

                showToast(message, type = 'info') {
                    const id = ++this.toastId;
                    const toast = { id, message, type, visible: true };
                    this.toasts.push(toast);

                    setTimeout(() => {
                        toast.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }, 4000);
                },

                removeToast(id) {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }
            }
        }
    </script>
</body>
</html>
